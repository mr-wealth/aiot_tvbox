apiVersion: apps/v1
kind: Deployment
metadata:
  name: qp-frontend
  namespace: querplantar
  labels:
    app: qp-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qp-frontend
  template:
    metadata:
      labels:
        app: qp-frontend
    spec:
      containers:
      - name: frontend
        image: 100.82.49.5:30500/qp_frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: qp-frontend
  namespace: querplantar
spec:
  selector:
    app: qp-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  type: NodePort
